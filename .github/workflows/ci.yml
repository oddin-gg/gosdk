name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - 'main'
      - 'develop'
      - 'next'
    tags:
      - 'v*'

# Least-privilege default for every job: read-only contents. Jobs that
# genuinely need more (golangci's check annotations, coverage's PR
# comment, release's asset upload) elevate PER JOB below — a global
# checks:write would hand write scopes to every job that executes
# checked-out repository code.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No job pushes with git credentials; don't persist the token
          # into .git/config where checked-out repo code could read it.
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - run: go version
      - name: Build
        run: make build
      - name: Verify build leaves the tree clean
        run: git diff --exit-code

  tests:
    name: Unit tests
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No job pushes with git credentials; don't persist the token
          # into .git/config where checked-out repo code could read it.
          persist-credentials: false
      - name: Prepare go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Run tests
        run: make test
      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage
          path: coverage.txt

  code_coverage:
    name: "Code coverage report"
    if: github.event_name == 'pull_request' # Do not run when workflow is triggered by push to main branch
    runs-on: ubuntu-latest
    needs: [ tests ]
    permissions:
      contents: read
      actions: read  # to download code coverage results from "test" job
      pull-requests: write # write permission needed to comment on PR
    steps:
      # Third-party action pinned to a full commit SHA (immutable) rather
      # than a mutable tag, so a compromised/retagged release can't inject
      # code into CI. Bump both the SHA and the version comment together.
      - uses: fgrosse/go-coverage-report@cbeb2ab2e32591d690337146ba02a911cc566f3f # v1.3.0
        continue-on-error: true
        with:
          coverage-artifact-name: "code-coverage" # can be omitted if you used this default value
          coverage-file-name: "coverage.txt" # can be omitted if you used this default value

  golangci:
    name: Static code check
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # only-new-issues resolution
      checks: write       # inline check annotations on the PR
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No job pushes with git credentials; don't persist the token
          # into .git/config where checked-out repo code could read it.
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Extract version from Makefile
        run: |
          VERSION=$(make golangci-lint-version)
          echo "golangci_version=$VERSION" >> $GITHUB_ENV
      - name: golangci-lint
        # v6 of this action does NOT support golangci-lint v2.x
        # ("invalid version string 'v2.12.1'"); v7+ is required for v2.
        # v8 explicitly requires golangci-lint >= v2.1.0 (we use v2.12.1).
        # v9 bumps the action runtime to node24. The pinned binary version
        # is in the Makefile (GOLANGCI_LINT_VERSION).
        #
        # Note on args: golangci-lint v2 removed the --exclude-dirs CLI
        # flag. Path-based exclusions belong in .golangci.yml under
        # linters.exclusions.paths. This repo never commits vendor/, so
        # we don't need any path-exclude.
        # Third-party action pinned to a full commit SHA (see coverage job).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.golangci_version }}
          args: --config .golangci.yml --timeout=5m

  dep-vulnerability:
    name: Dependency vulnerability scanner
    # Gates PRs and releases: a reachable vulnerability must fail the
    # check, not just annotate it (release below depends on this job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No job pushes with git credentials; don't persist the token
          # into .git/config where checked-out repo code could read it.
          persist-credentials: false
      - name: Prepare go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Check
        run: make govulncheck

  version_guard:
    name: Tag matches SDK version
    # Only meaningful on a version tag push; skipped on branch/PR runs.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No job pushes with git credentials; don't persist the token
          # into .git/config where checked-out repo code could read it.
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Validate SDK is a Go-compatible module version
        # Canonical validation via golang.org/x/mod: module.Check verifies
        # semver correctness AND the major-version-vs-module-path rule (so
        # "2.0.0" on the bare, non-/v2 path is rejected), plus a
        # build-metadata rejection that closes the "+incompatible" escape.
        # No hand-rolled semver regex to drift.
        run: go test -run '^TestSDK_IsValidModuleVersion$|^TestReleasableVersion_RejectsInvalid$' ./internal/version/
      - name: Tag must equal v<SDK>
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SDK=$(grep -oE 'const SDK = "[^"]+"' internal/version/version.go | sed -E 's/.*"([^"]+)".*/\1/')
          echo "internal/version.SDK = ${SDK}"
          echo "git tag              = ${TAG}"
          # Exact string equality only (semver validity is proven by the
          # module.Check test above); no version parsing here.
          if [ "${TAG}" != "v${SDK}" ]; then
            echo "::error::tag ${TAG} does not match v${SDK} — bump internal/version.SDK to ${TAG#v} before tagging"
            exit 1
          fi

  release:
    name: Create GitHub Release
    needs: [build, tests, golangci, version_guard, dep-vulnerability]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # No job pushes with git credentials; don't persist the token
          # into .git/config where checked-out repo code could read it.
          persist-credentials: false
      - name: Create GitHub Release
        # Third-party action pinned to a full commit SHA (see coverage job).
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true

  changelog:
    name: Post release changelog
    # Lives in the tag run, NOT in an `on: release` workflow: the release above
    # is created with the default GITHUB_TOKEN, and GitHub does not trigger
    # workflows from GITHUB_TOKEN-generated events — so a release-triggered
    # workflow would never fire for this repo. Render + post are inlined
    # because a public repo cannot use the internal ragnar-notify workflow or
    # action. Keep in sync with
    # oddin-gg/ragnar-notify/.github/workflows/release-changelog.yml.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — Slack token present and valid
        env:
          TOKEN: ${{ secrets.SLACK_BOT_TOKEN_CHANGELOG }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error title=Changelog not posted::SLACK_BOT_TOKEN_CHANGELOG is not set. Add it as a repo secret (the changelog bot token) so release changelogs can post to Slack."
            exit 1
          fi
          if ! curl -sS -X POST https://slack.com/api/auth.test -H "Authorization: Bearer ${TOKEN}" | grep -q '"ok":true'; then
            echo "::error title=Changelog not posted::SLACK_BOT_TOKEN_CHANGELOG is set but Slack rejected it (expired/revoked/wrong scope). Re-set the changelog bot token."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so the previous-release..tag commit range resolves.
          fetch-depth: 0
          # No job pushes with git credentials; don't persist the token
          # into .git/config where checked-out repo code could read it.
          persist-credentials: false

      - name: Render changelog
        id: render
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          MAX_ENTRIES: "80"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Previous release = latest published GitHub Release (git describe fallback).
          prev="$(gh api "repos/${REPO}/releases?per_page=30" \
            --jq "[ .[] | select(.draft == false and .prerelease == false) | .tag_name ] | map(select(. != \"${TAG}\")) | .[0] // empty" 2>/dev/null || true)"
          if [ -z "${prev}" ]; then
            prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-rc*' "${TAG}^" 2>/dev/null || true)"
          fi
          range="${prev:+${prev}..}${TAG}"
          echo "Changelog range: ${range} (previous release: ${prev:-none})"

          subjects="$(git log --no-merges --pretty=format:'%s' "${range}")"
          if [ -z "${subjects}" ]; then
            echo "No commits in range ${range}; nothing to post."
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          total="$(printf '%s\n' "${subjects}" | grep -c '')"
          if [ "${total}" -gt "${MAX_ENTRIES}" ]; then
            subjects="$(printf '%s\n' "${subjects}" | sed -n "1,${MAX_ENTRIES}p")"$'\n'"…and $((total - MAX_ENTRIES)) more commits"
          fi

          # Escape & < > in the untrusted subjects (mirrors escapeSlackText in notify.go)
          # BEFORE splicing link markup, then post the text raw — links stay live and a
          # subject like "<!channel>" can't inject a mass-ping.
          body="$(printf '%s\n' "${subjects}" \
            | sed -E 's@&@\&amp;@g; s@<@\&lt;@g; s@>@\&gt;@g' \
            | sed -E 's@\[([A-Z][A-Z0-9]+-[0-9]+)\]@[<https://oddingg.atlassian.net/browse/\1|\1>]@g' \
            | sed -E "s@\(#([0-9]+)\)@(<https://github.com/${REPO}/pull/\1|#\1>)@g" \
            | sed -E 's@^@• @')"
          message="$(printf 'Released *%s*\n%s' "${TAG}" "${body}")"

          {
            echo "has_changes=true"
            echo "message<<__CHANGELOG_EOF__"
            printf '%s\n' "${message}"
            echo "__CHANGELOG_EOF__"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Release changelog"
            echo "- **Tag:** ${TAG}"
            echo "- **Since:** ${prev:-<first release>}"
            echo "- **Commits:** ${total}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Rendered:"; printf '%s\n' "${message}"

      - name: Post changelog to Slack
        if: steps.render.outputs.has_changes == 'true'
        env:
          TOKEN: ${{ secrets.SLACK_BOT_TOKEN_CHANGELOG }}
          CHANNEL: "#product-changelog"
          SLACK_USERNAME: gosdk
          ICON_URL: https://cdn.test.oddin.dev/ragnar-notify/gosdk.png
          MESSAGE: ${{ steps.render.outputs.message }}
        run: |
          set -euo pipefail

          # Same payload ragnar-notify sends in raw mode with no app-name prefix:
          # {channel, text, username, icon_url}. jq builds it so the subjects
          # cannot break out of the JSON string.
          payload="$(jq -n \
            --arg channel "${CHANNEL}" \
            --arg text "${MESSAGE}" \
            --arg username "${SLACK_USERNAME}" \
            --arg icon_url "${ICON_URL}" \
            '{channel: $channel, text: $text, username: $username, icon_url: $icon_url}')"

          # Slack signals API errors as HTTP 200 + {"ok":false}, so check both the
          # status code and .ok — mirrors the two checks in notify.go's post().
          out="${RUNNER_TEMP}/slack-response.json"
          code="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "${payload}" \
            -o "${out}" -w '%{http_code}')"

          if [ "${code}" != "200" ] || ! jq -e '.ok' "${out}" >/dev/null 2>&1; then
            reason="$(jq -r '.error // empty' "${out}" 2>/dev/null || true)"
            echo "::error title=Changelog not posted::Slack chat.postMessage failed (HTTP ${code}): ${reason:-$(head -c 200 "${out}")}"
            exit 1
          fi
          echo "Posted to ${CHANNEL} (ts=$(jq -r '.ts' "${out}"))"
